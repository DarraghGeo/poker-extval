name: Publish to npm

# Publishes the package whenever main receives a push with a version that is not yet on npm.
# Authenticates with npm trusted publishing (OIDC), so no NPM_TOKEN secret is needed.
# The npm trusted publisher for this package must point at DarraghGeo/poker-extval and this
# workflow filename (publish.yml), with no environment.

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write # required for npm trusted publishing

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing requires npm 11.5.1 or later
      - run: npm install -g npm@^11.5.1

      - run: npm ci

      - run: npm test

      - name: Check whether this version is already published
        id: check
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version > /dev/null 2>&1; then
            echo "$NAME@$VERSION is already on npm; skipping publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Publishing $NAME@$VERSION."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.check.outputs.publish == 'true'
        run: npm publish
